baseURL: "https://newenglandcompbio.org/"
title: "NECB 2026"
languageCode: "en-us"
defaultContentLanguage: "en"

googleAnalytics: "G-WK1YTWSXZD"

enableRobotsTXT: true
enableEmoji: true
enableGitInfo: false

disableKinds:
  - taxonomy
  - term

permalinks:
  page: "/:slug/"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github

params:
  description: "New England Computational Biology Symposium 2026 — Oct 1–2, Cambridge, MA"
  author: "NECB Organizing Committee"
  contactEmail: "newenglandcompbio@gmail.com"
  conferenceDate: "October 1–2, 2026"
  conferenceLocation: "Cambridge, MA"
  venueName: "Microsoft Research New England"
  venueAddress: "One Memorial Drive, Cambridge, MA 02142"
  attendeeCap: 350
  format: "In-person only"
  registrationStatus: "Registration — coming soon"
  registrationURL: "https://iscb.swoogo.com/necb2026/begin"
  # Set registrationClosed: true to swap the primary CTA from "Register"
  # to "Join waitlist" and replace the capacity banner with a
  # registration-closed notice. Waitlist form is a Google Form owned by
  # the organizing committee.
  registrationClosed: true
  waitlistURL: "https://forms.gle/LiPMGD5vPndxYfjd6"
  abstractStatus: "Call for abstracts — coming soon"
  abstractURL: "https://www.iscb.org/application?formId=49"
  logo: "img/logo.svg"
  favicon: "img/favicon.svg"
  ogImage: "img/og-image.png"

  social:
    # Blank strings hide that icon from the footer. Populate as accounts
    # come online; the footer auto-renders any set entry.
    twitter: "https://x.com/NewEngCompBio"
    linkedin: ""
    bluesky: ""
    github: ""

