keynotes:
  title: "Keynote Speakers"
  members:
    - name: "Sergey Ovchinnikov"
      affiliation: "MIT"
      short_affiliation: "MIT"
      photo: "img/people/sergey-ovchinnikov.jpg"
      bio: "MIT Department of Biology. His research develops deep learning methods for protein structure prediction and design, contributing to widely used tools such as ColabFold and modern approaches to evolutionary protein modeling."
    - name: "G.V. Shivashankar"
      affiliation: "ETH Zurich · Paul Scherrer Institute"
      short_affiliation: "ETH Zurich · PSI"
      photo: "img/people/gv-shivashankar.jpg"
      bio: "ETH Zurich and the Paul Scherrer Institute. His group studies how mechanical forces on the cell nucleus regulate chromatin organization and gene expression, linking mechanobiology to cell fate decisions."
    - name: "Caroline Uhler"
      affiliation: "Broad Institute · MIT"
      short_affiliation: "Broad · MIT"
      photo: "img/people/caroline-uhler.jpg"
      bio: "Professor at MIT and Co-Director of the Eric and Wendy Schmidt Center at the Broad Institute. Her research bridges statistics, machine learning, and biology, with a focus on causal inference for gene regulation and single-cell analysis."
    - name: "Marc Vidal"
      affiliation: "Dana-Farber Cancer Institute · Harvard Medical School"
      short_affiliation: "DFCI · HMS"
      photo: "img/people/marc-vidal.jpg"
      bio: "Professor of Genetics at Harvard Medical School and Founding Director of the Center for Cancer Systems Biology (CCSB) at Dana-Farber Cancer Institute. His group pioneered systems-scale mapping of the human protein–protein interactome to understand how mutations perturb networks in disease."
    - name: "Zhiping Weng"
      affiliation: "UMass Chan Medical School"
      short_affiliation: "UMass Chan"
      photo: "img/people/zhiping-weng.jpg"
      bio: "Li Weibo Professor of Biomedical Research and founding Chair of the Department of Genomics and Computational Biology at UMass Chan Medical School. Her group develops computational methods for functional annotation of the human genome and leads the data analysis center of the ENCODE Consortium."

invited:
  title: "Invited Speakers"
  members:
    - name: "Alex Lu"
      affiliation: "Microsoft Research New England"
      short_affiliation: "Microsoft Research"
      photo: "img/people/alex-lu.jpg"
      bio: "Senior Researcher at Microsoft Research New England. His work explores how machine learning — particularly self-supervised methods — can extract new biological insights from cellular imaging and molecular data."
      talk_title: "Vermeer: Autoregressive generative modeling of microscopy predicts protein localization"
      talk_abstract: "Understanding how proteins localize inside of cells is critical to understanding how cells regulate themselves by moving around proteins, and how these processes are disrupted in disease. Towards characterizing this, systematic microscopy datasets have emerged imaging almost every protein in an organism across cell types or perturbations. However, even high-throughput technologies struggle to fully cover the possible space of experiments in this data collection. In this talk, I will show that generative AI models can help prioritize data collection by simulating unseen experiments to predict which ones will possibly yield informative outcomes. I will introduce our work in Vermeer, which autoregressively generates microscopy images showing how proteins express in cells, predicting what proteins may be differentially regulated across different cell types and how alterations to protein sequence modify this behavior. I will show that Vermeer can accurately simulate the impacts of alterations to protein sequence on localization within cells, providing a basis for discovering novel mediators of localization within the proteome."
    - name: "Sahin Naqvi"
      affiliation: "Boston Children's Hospital · Harvard Medical School"
      short_affiliation: "BCH · HMS"
      photo: "img/people/sahin-naqvi.jpg"
      bio: "Assistant Professor in the Division of Gastroenterology at Boston Children's Hospital and the Department of Pediatrics at Harvard Medical School. His lab uses quantitative approaches to study transcription factor function and developmental gene regulatory programs."
      talk_title: "Measuring and modeling transcription factor dosage effects"
      talk_abstract: "Transcription factors (TFs) dictate cellular and developmental gene expression programs by binding to specific DNA motifs within noncoding regulatory elements (REs) and modulating their activity. Quantitative changes in TF levels (dosage) underlie both common phenotypic variation and severe disease, but the mechanisms underlying this TF dosage sensitivity have remained poorly understood. I will describe our efforts to tackle this problem using experimental and computational approaches. First, we combined chemical genetic tools, stem cell models of human neural crest cells, and epigenomic mapping to quantify how REs and genes respond to precisely modulated TF dosage. We found that while many TF-dependent REs and genes are buffered against small changes in TF dosage, others are highly sensitive, linking altered TF dosage to specific developmental phenotypes. Second, we applied sequence-to-activity deep learning models to predict RE responses from DNA sequence, achieving near-experimental accuracy. These models revealed predictive sequence features that are undetectable by models of steady-state RE activity, and could interpret noncoding variants associated with variation in craniofacial shape. These results show that combining quantitative TF perturbations with deep learning can uncover additional layers of the cis-regulatory code, with implications for the development of cellular foundation models."
    - name: "Armita Nourmohammad"
      affiliation: "Yale University"
      short_affiliation: "Yale"
      photo: "img/people/armita-nourmohammad.jpg"
      bio: "Yale University, working at the interface of physics, evolution, and immunology. Her group develops theoretical and computational models of how immune repertoires adapt in response to pathogens and disease."
    - name: "Samantha Petti"
      affiliation: "Tufts University"
      short_affiliation: "Tufts"
      photo: "img/people/samantha-petti.jpg"
      bio: "Assistant Professor of Mathematics and Computer Science at Tufts University. Her group designs mathematical and computational methods to infer fitness landscapes and describe evolutionary processes, with applications to protein sequence and structure analysis."
      talk_title: "Modeling, interpreting, and optimizing high-dimensional genotype-phenotype maps"
      talk_abstract: "A fundamental goal of genetics is to understand how variation in biological sequences gives rise to differences in measurable characteristics called phenotypes. The mapping from genotype (DNA, RNA or protein sequence) to phenotype can be difficult to model and interpret because the space of possible sequences is enormous and combinations of mutations interact in complex ways. We describe how to use a Bayesian method called Gaussian process regression to learn genotype-phenotype maps. We demonstrate that Gaussian process regression with our priors yields better predictive performance on several datasets and show how the learned prior can be interpreted to provide clues into how phenotype arises from genotype biologically. We derive tractable analytical expressions for computing a broad class of statistics under these models that would ordinarily require predictions across the entire sequence space, and discuss how this new \"kernel trick\" can be used both to interpret the structure of the genotype-phenotype map and to navigate toward regions of sequence space with desirable properties."
    - name: "Yuri Pritykin"
      affiliation: "Princeton University"
      short_affiliation: "Princeton"
      photo: "img/people/yuri-pritykin.jpg"
      bio: "Princeton University, in the Department of Computer Science and the Lewis-Sigler Institute for Integrative Genomics. His group develops computational methods for single-cell and spatial genomics to study immune cell function in cancer and infection."
    - name: "Rong Ma"
      affiliation: "Harvard T.H. Chan School of Public Health"
      short_affiliation: "Harvard Chan"
      photo: "img/people/rong-ma.jpg"
      bio: "Department of Biostatistics at the Harvard T.H. Chan School of Public Health. She develops statistical methods for high-dimensional inference and dimension reduction, with applications to single-cell genomics and computational biology."
      talk_title: "Geometry of Cell States: From Embeddings to Dynamics"
      talk_abstract: "Single-cell data are often organized around low-dimensional geometric structures—clusters, manifolds, trajectories, and dynamic vector fields—that reflect cell-state heterogeneity and encode biological processes such as differentiation and regulation. This suggests a geometric view of single-cell analysis in which the geometry of the data is not merely a visualization device, but an object to be statistically assessed and biologically interpreted. In this talk, I will discuss our recent work along this direction. I will first describe how a stability-based perspective can be used to evaluate when nonlinear embeddings such as t-SNE and UMAP faithfully represent cellular relationships, and to identify regions of an embedding that are intrinsically less reliable. I will then present a manifold learning framework for denoising and embedding RNA velocity, in which cellular dynamics are represented as vector fields constrained by the geometry of the underlying cell-state manifold. These examples illustrate how geometric inference can connect visualization, uncertainty assessment, and dynamical modeling, providing both rigorous statistical tools and new ways to study cellular processes."
