<header class="navbar" id="navbar">
  <div class="container navbar-inner">
    <a href="{{ "/" | relURL }}" class="brand" aria-label="NECB 2026 home">
      <img src="{{ "img/logo.svg" | relURL }}" alt="" class="brand-logo">
      <span class="brand-text">NECB <span class="brand-year">2026</span></span>
    </a>

    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-nav">
      <span></span><span></span><span></span>
    </button>

    <div class="navbar-right">
      <nav id="primary-nav" class="primary-nav" aria-label="Primary">
        <ul>
          {{ range site.Menus.main }}
            <li><a href="{{ .URL }}">{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </nav>
      <a class="nav-partner" href="https://www.iscb.org/" target="_blank" rel="noopener"
         aria-label="In partnership with ISCB — International Society for Computational Biology">
        <span class="nav-partner-label">In partnership with</span>
        <img alt="ISCB" src="{{ "img/partners/iscb-tile.png" | relURL }}">
      </a>
    </div>
  </div>
</header>
