<section class="section section-alt" id="themes">
  <div class="container">
    <h2 class="section-title">Focus Areas</h2>
    <p class="section-sub">Submissions are welcome across all of computational biology. Five intersecting themes we'll spotlight in 2026:</p>
    <div class="card-grid grid-5">
      {{ range site.Data.themes.items }}
      <article class="card theme-card theme-{{ .accent | default "primary" }}">
        {{ if .image }}
        <img class="theme-icon-img" src="{{ .image | relURL }}" alt="" loading="lazy">
        {{ else if .icon }}
        <div class="theme-icon" aria-hidden="true">{{ .icon }}</div>
        {{ end }}
        <h3 class="card-title">{{ .title }}</h3>
        <p class="card-body">{{ .description }}</p>
      </article>
      {{ end }}
    </div>
  </div>
</section>
